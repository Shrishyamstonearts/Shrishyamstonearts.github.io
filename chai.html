<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Wala Run - Prototype</title>
    <style>
        body {
            text-align: center;
            background: #2c1d11;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        #gameCanvas {
            background: #f4e8c1;
            border: 4px solid #8b5a2b;
            border-radius: 10px;
            max-width: 100%;
        }
        .btn {
            background: #e67e22;
            color: white;
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>☕ Chai Wala Run</h1>
    <p>Tap "Prepare Chai" then tap "Customer" to serve!</p>
    <canvas id="gameCanvas" width="360" height="480"></canvas>
    <br>
    <button class="btn" onclick="prepareChai()">☕ Prepare Chai (<span id="chaiCount">0</span>)</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let chaiReady = 0;
        let customers = [];

        function prepareChai() {
            if (chaiReady < 3) {
                chaiReady++;
                document.getElementById("chaiCount").innerText = chaiReady;
            }
        }

        function spawnCustomer() {
            const xPos = Math.random() * (canvas.width - 60) + 30;
            customers.push({ x: xPos, y: 50, timer: 100 });
        }

        setInterval(spawnCustomer, 3000);

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Tapri Counter
            ctx.fillStyle = "#8b5a2b";
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            ctx.fillStyle = "#fff";
            ctx.font = "16px Arial";
            ctx.fillText("Score: " + score, 20, 30);

            // Draw Customers
            for (let i = 0; i < customers.length; i++) {
                let c = customers[i];
                c.timer -= 0.2;

                // Customer Face
                ctx.fillStyle = "#e74c3c";
                ctx.beginPath();
                ctx.arc(c.x, c.y, 25, 0, Math.PI * 2);
                ctx.fill();

                // Patience Bar
                ctx.fillStyle = "red";
                ctx.fillRect(c.x - 20, c.y - 35, 40, 5);
                ctx.fillStyle = "green";
                ctx.fillRect(c.x - 20, c.y - 35, (c.timer / 100) * 40, 5);

                if (c.timer <= 0) {
                    customers.splice(i, 1);
                    alert("Customer Gussa Ho Gaya! Game Over. Score: " + score);
                    score = 0;
                    chaiReady = 0;
                    customers = [];
                    document.getElementById("chaiCount").innerText = 0;
                    break;
                }
            }

            requestAnimationFrame(update);
        }

        canvas.addEventListener("click", function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let i = 0; i < customers.length; i++) {
                let c = customers[i];
                let dist = Math.hypot(mouseX - c.x, mouseY - c.y);
                if (dist < 30 && chaiReady > 0) {
                    chaiReady--;
                    document.getElementById("chaiCount").innerText = chaiReady;
                    score += 10;
                    customers.splice(i, 1);
                    break;
                }
            }
        });

        update();
    </script>
</body>
</html>
